name: ci-frontend.yml
on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/ci-frontend.yml

  pull_request:
    paths:
      - frontend/**
      - .github/workflows/ci-frontend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Setup Node JS
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Verify Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Test
        run: npm run test
        working-directory: frontend

      - name: Verify Build
        run: npm run build
        working-directory: frontend
